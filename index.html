 <!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Акустичний Пеленгатор v5 (Фільтрація Цілей)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.1rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .radar-box {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 10px;
    }
    canvas#radar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #020617;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.82rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #1f2937;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #374151;
    }
    label { color: #9ca3af; font-size: 0.72rem; text-transform: uppercase; }

    select, input[type="range"] {
      width: 100%;
      background: #111827;
      border: 1px solid #374151;
      color: #f3f4f6;
      padding: 6px 8px;
      border-radius: 6px;
      accent-color: #38bdf8;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .step-badge {
      background: #0284c7;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .target-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 4px;
    }

    .btn-target {
      padding: 6px 4px;
      background: #111827;
      border: 1px solid #374151;
      color: #9ca3af;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-target.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      font-weight: bold;
    }

    .btn-action {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-action:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .status-box {
      font-size: 0.75rem;
      color: #38bdf8;
      text-align: center;
      padding: 4px;
      background: #030712;
      border-radius: 4px;
      border: 1px solid #1f2937;
    }

    canvas#spectrum {
      width: 100%;
      height: 35px;
      background: #000;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>Пеленгатор v5: Фільтр Цілей</h1>

  <div class="radar-box">
    <canvas id="radar" width="280" height="280"></canvas>
  </div>

  <div class="panel">
    <div class="status-box" id="status-text">Виберіть профіль цілі та ініціалізуйте аудіо</div>

    <!-- Блок вибору цілі / фільтрації -->
    <div class="form-group" style="background: #1e1b4b; border-color: #4338ca;">
      <div class="row">
        <label style="color: #a5b4fc;">🎯 Селектор Акустичної Цілі:</label>
        <span id="target-info" style="color: #38bdf8; font-weight: bold;">Авто</span>
      </div>
      <div class="target-grid">
        <button class="btn-target active" data-target="auto">🤖 Авто</button>
        <button class="btn-target" data-target="shahed">🛸 Шахед/Герань</button>
        <button class="btn-target" data-target="moped">🛵 Мопед/2T</button>
        <button class="btn-target" data-target="rocket">🚀 Ракета</button>
        <button class="btn-target" data-target="plane">✈️ Літак</button>
        <button class="btn-target" data-target="manual">🎛️ Ручне</button>
      </div>

      <!-- Ручне налаштування (приховане за замовчуванням) -->
      <div id="manual-controls" style="display: none; margin-top: 6px;">
        <div class="row">
          <label>Центральна частота (Гц):</label>
          <span id="lbl-freq" style="color:#38bdf8">350 Гц</span>
        </div>
        <input type="range" id="manual-freq" min="50" max="5000" step="25" value="350">
        
        <div class="row" style="margin-top: 4px;">
          <label>Добротність Q (Ширина смуги):</label>
          <span id="lbl-q" style="color:#38bdf8">3.0</span>
        </div>
        <input type="range" id="manual-q" min="0.5" max="10" step="0.5" value="3.0">
      </div>
    </div>

    <canvas id="spectrum" width="396" height="35"></canvas>

    <!-- Налаштування мікрофонів -->
    <div class="form-group">
      <div class="row">
        <label><span class="step-badge">MIC 1</span> Основний (0°)</label>
        <span id="lbl-m1-val" style="color:#38bdf8">0° | 0 мс</span>
      </div>
      <select id="mic-1"><option>Завантаження...</option></select>
    </div>

    <div class="form-group">
      <div class="row">
        <label><span class="step-badge" style="background:#f59e0b">MIC 2</span> Додатковий (90°)</label>
        <span id="lbl-m2-val" style="color:#f59e0b">90° | 120 мс</span>
      </div>
      <select id="mic-2"><option>Завантаження...</option></select>
      <div class="row" style="margin-top: 4px;">
        <label>Компенсація затримки (мс):</label>
        <input type="range" id="m2-delay" min="0" max="500" value="120" style="width: 60%;">
      </div>
    </div>

    <div class="row" style="font-size:0.75rem;">
      <span>M1: <b id="pwr-m1" style="color:#10b981">0%</b></span>
      <span>M2: <b id="pwr-m2" style="color:#f59e0b">0%</b></span>
      <span>Азимут: <b id="calc-azimuth" style="color:#38bdf8">0°</b></span>
    </div>

    <button class="btn-action" id="btn-init">1. Старт Калібрування</button>
    <button class="btn-action" id="btn-scan" disabled>2. Запустити Пеленгацію</button>
  </div>

  <script>
    const rCanvas = document.getElementById('radar');
    const rCtx = rCanvas.getContext('2d');
    const sCanvas = document.getElementById('spectrum');
    const sCtx = sCanvas.getContext('2d');

    const mic1Select = document.getElementById('mic-1');
    const mic2Select = document.getElementById('mic-2');
    const m2Delay = document.getElementById('m2-delay');
    const lblM2 = document.getElementById('lbl-m2-val');
    const statusText = document.getElementById('status-text');

    const targetBtns = document.querySelectorAll('.btn-target');
    const targetInfo = document.getElementById('target-info');
    const manualControls = document.getElementById('manual-controls');
    const manualFreq = document.getElementById('manual-freq');
    const manualQ = document.getElementById('manual-q');
    const lblFreq = document.getElementById('lbl-freq');
    const lblQ = document.getElementById('lbl-q');

    const btnInit = document.getElementById('btn-init');
    const btnScan = document.getElementById('btn-scan');

    let audioCtx, filter1, filter2, analyser1, analyser2, spectrumAnalyser;
    let delayNode1, delayNode2;
    let isInitialized = false, isScanning = false;
    let currentAzimuth = 0, scanLineAngle = 0;
    let activeTargetMode = 'auto';

    // Профілі частот (Центральна частота та Q-фактор)
    const TARGET_PROFILES = {
      shahed: { freq: 280, q: 4.0, label: "Шахед (120-450 Гц)" },
      moped:  { freq: 450, q: 2.5, label: "Мопед/2T (200-800 Гц)" },
      rocket: { freq: 2800, q: 1.8, label: "Ракета (1.5-4.5 кГц)" },
      plane:  { freq: 180, q: 3.5, label: "Літак (80-350 Гц)" },
      manual: { freq: 350, q: 3.0, label: "Ручний режим" },
      auto:   { freq: 500, q: 1.0, label: "Авто-Захоплення" }
    };

    // Перемикання пресетів
    targetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        targetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTargetMode = btn.dataset.target;

        if (activeTargetMode === 'manual') {
          manualControls.style.display = 'block';
        } else {
          manualControls.style.display = 'none';
        }

        applyFilterSettings();
      });
    });

    manualFreq.addEventListener('input', (e) => {
      lblFreq.textContent = `${e.target.value} Гц`;
      applyFilterSettings();
    });

    manualQ.addEventListener('input', (e) => {
      lblQ.textContent = parseFloat(e.target.value).toFixed(1);
      applyFilterSettings();
    });

    function applyFilterSettings() {
      if (!filter1 || !filter2) return;

      const profile = TARGET_PROFILES[activeTargetMode];
      targetInfo.textContent = profile.label;

      if (activeTargetMode === 'manual') {
        filter1.frequency.value = parseFloat(manualFreq.value);
        filter2.frequency.value = parseFloat(manualFreq.value);
        filter1.Q.value = parseFloat(manualQ.value);
        filter2.Q.value = parseFloat(manualQ.value);
      } else if (activeTargetMode !== 'auto') {
        filter1.frequency.value = profile.freq;
        filter2.frequency.value = profile.freq;
        filter1.Q.value = profile.q;
        filter2.Q.value = profile.q;
      }
    }

    m2Delay.addEventListener('input', () => {
      lblM2.textContent = `90° | ${m2Delay.value} мс`;
      if (delayNode2) delayNode2.delayTime.value = m2Delay.value / 1000;
    });

    // Отримання мікрофонів
    async function getDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        mic1Select.innerHTML = ''; mic2Select.innerHTML = '';
        const inputs = devices.filter(d => d.kind === 'audioinput');
        inputs.forEach((d, i) => {
          mic1Select.add(new Option(d.label || `Мікрофон ${i+1}`, d.deviceId));
          mic2Select.add(new Option(d.label || `Мікрофон ${i+1}`, d.deviceId));
        });
        if (inputs.length > 1) mic2Select.selectedIndex = 1;
      } catch (e) {
        statusText.textContent = "Помилка доступу до мікрофонів!";
      }
    }
    getDevices();

    // Малювання радара
    function drawRadar() {
      const w = rCanvas.width, h = rCanvas.height;
      const cx = w / 2, cy = h / 2, r = w / 2 - 15;

      rCtx.clearRect(0, 0, w, h);
      rCtx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
      rCtx.lineWidth = 1;
      [r * 0.33, r * 0.66, r].forEach(rad => {
        rCtx.beginPath(); rCtx.arc(cx, cy, rad, 0, Math.PI * 2); rCtx.stroke();
      });

      rCtx.beginPath();
      rCtx.moveTo(cx - r, cy); rCtx.lineTo(cx + r, cy);
      rCtx.moveTo(cx, cy - r); rCtx.lineTo(cx, cy + r);
      rCtx.stroke();

      // М1 (0° - верх)
      rCtx.fillStyle = '#10b981';
      rCtx.beginPath(); rCtx.arc(cx, cy - r + 5, 5, 0, Math.PI * 2); rCtx.fill();

      // М2 (90° - право)
      rCtx.fillStyle = '#f59e0b';
      rCtx.beginPath(); rCtx.arc(cx + r - 5, cy, 5, 0, Math.PI * 2); rCtx.fill();

      if (isScanning) {
        scanLineAngle = (scanLineAngle + 0.04) % (Math.PI * 2);
        rCtx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
        rCtx.beginPath();
        rCtx.moveTo(cx, cy);
        rCtx.lineTo(cx + r * Math.cos(scanLineAngle), cy + r * Math.sin(scanLineAngle));
        rCtx.stroke();

        const azRad = (currentAzimuth - 90) * (Math.PI / 180);
        rCtx.strokeStyle = '#ef4444';
        rCtx.lineWidth = 3;
        rCtx.beginPath();
        rCtx.moveTo(cx, cy);
        rCtx.lineTo(cx + (r - 10) * Math.cos(azRad), cy + (r - 10) * Math.sin(azRad));
        rCtx.stroke();
      }

      requestAnimationFrame(drawRadar);
    }
    drawRadar();

    // Малювання Спектрограми
    function drawSpectrum() {
      if (!spectrumAnalyser) return;
      const buffer = new Uint8Array(spectrumAnalyser.frequencyBinCount);
      spectrumAnalyser.getByteFrequencyData(buffer);

      sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
      const barWidth = (sCanvas.width / buffer.length) * 2;
      let x = 0;

      // Авто-захоплення частоти піку
      let maxVol = 0, maxIndex = 0;

      for (let i = 0; i < buffer.length; i++) {
        const barHeight = (buffer[i] / 255) * sCanvas.height;
        sCtx.fillStyle = (activeTargetMode === 'auto') ? '#a855f7' : '#38bdf8';
        sCtx.fillRect(x, sCanvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;

        if (buffer[i] > maxVol) {
          maxVol = buffer[i];
          maxIndex = i;
        }
      }

      // Якщо режим АВТО - підлаштовуємо фільтр під найгучніший пік
      if (activeTargetMode === 'auto' && maxVol > 50 && filter1) {
        const nyquist = audioCtx.sampleRate / 2;
        const peakFreq = (maxIndex / buffer.length) * (nyquist / 4);
        if (peakFreq > 60) {
          filter1.frequency.value = peakFreq;
          filter2.frequency.value = peakFreq;
          targetInfo.textContent = `Авто (${Math.round(peakFreq)} Гц)`;
        }
      }

      requestAnimationFrame(drawSpectrum);
    }

    // Аудіо процес
    btnInit.addEventListener('click', async () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      try {
        const stream1 = await navigator.mediaDevices.getUserMedia({
          audio: { deviceId: { exact: mic1Select.value }, echoCancellation: false, noiseSuppression: false }
        });
        const stream2 = await navigator.mediaDevices.getUserMedia({
          audio: { deviceId: { exact: mic2Select.value }, echoCancellation: false, noiseSuppression: false }
        });

        const src1 = audioCtx.createMediaStreamSource(stream1);
        const src2 = audioCtx.createMediaStreamSource(stream2);

        // Вузли Затримки
        delayNode1 = audioCtx.createDelay(1.0);
        delayNode2 = audioCtx.createDelay(1.0);
        delayNode2.delayTime.value = parseFloat(m2Delay.value) / 1000;

        // Вузли Фільтрації (Bandpass)
        filter1 = audioCtx.createBiquadFilter();
        filter2 = audioCtx.createBiquadFilter();
        filter1.type = "bandpass";
        filter2.type = "bandpass";

        analyser1 = audioCtx.createAnalyser();
        analyser2 = audioCtx.createAnalyser();
        spectrumAnalyser = audioCtx.createAnalyser();
        analyser1.fftSize = 256;
        analyser2.fftSize = 256;
        spectrumAnalyser.fftSize = 128;

        // З'єднання ланцюга: Src -> Delay -> Filter -> Analyser
        src1.connect(delayNode1);
        delayNode1.connect(filter1);
        filter1.connect(analyser1);
        filter1.connect(spectrumAnalyser);

        src2.connect(delayNode2);
        delayNode2.connect(filter2);
        filter2.connect(analyser2);

        applyFilterSettings();

        isInitialized = true;
        btnScan.disabled = false;
        btnInit.style.display = 'none';
        statusText.textContent = "Система відфільтрована. Натисніть «Запустити Пеленгацію».";

        processAudio();
        drawSpectrum();
      } catch (err) {
        statusText.textContent = "Помилка підключення аудіопристроїв!";
      }
    });

    function processAudio() {
      if (!isInitialized) return;

      const buf1 = new Uint8Array(analyser1.frequencyBinCount);
      const buf2 = new Uint8Array(analyser2.frequencyBinCount);

      analyser1.getByteFrequencyData(buf1);
      analyser2.getByteFrequencyData(buf2);

      const avg1 = buf1.reduce((a, b) => a + b, 0) / buf1.length;
      const avg2 = buf2.reduce((a, b) => a + b, 0) / buf2.length;

      document.getElementById('pwr-m1').textContent = `${Math.round((avg1 / 255) * 100)}%`;
      document.getElementById('pwr-m2').textContent = `${Math.round((avg2 / 255) * 100)}%`;

      if (avg1 + avg2 > 5) {
        const ratio = avg2 / (avg1 + avg2);
        currentAzimuth = ratio * 90; // кут між M1 (0°) та M2 (90°)
        document.getElementById('calc-azimuth').textContent = `${Math.round(currentAzimuth)}°`;
      }

      setTimeout(processAudio, 40);
    }

    btnScan.addEventListener('click', () => {
      isScanning = true;
      statusText.textContent = `Сканування активне [Профіль: ${activeTargetMode.toUpperCase()}]`;
      btnScan.style.background = "#10b981";
      btnScan.textContent = "Пеленгація працює";
    });
  </script>
</body>
</html>
